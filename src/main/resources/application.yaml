server:
  port: ${PORT:8080}

spring:
  application:
    name: accounting-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:supabase}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cuentas}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:Konta ERP <onboarding@resend.dev>}

groq:
  api-key: ${GROQ_API_KEY:}
  api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  primary-model: ${GROQ_PRIMARY_MODEL:qwen/qwen3.8-27b}
  fallback-model: ${GROQ_FALLBACK_MODEL:openai/gpt-oss-120b}
