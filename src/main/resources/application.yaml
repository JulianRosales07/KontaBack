server:
  port: ${PORT:8080}

spring:
  application:
    name: accounting-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:supabase}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cuentas}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:Konta ERP <onboarding@resend.dev>}

groq:
  api-key: ${GROQ_API_KEY:}
  api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  primary-model: ${GROQ_PRIMARY_MODEL:qwen/qwen3.8-27b}
  fallback-model: ${GROQ_FALLBACK_MODEL:openai/gpt-oss-120b}

app:
  organization:
    name: ${ORGANIZATION_NAME:Asociación}
    nit: ${ORGANIZATION_NIT:}
  security:
    # Solo asignación inicial: se otorga SUPER_ADMIN a este correo únicamente si aún no existe ningún SUPER_ADMIN.
    bootstrap-super-admin-email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:juliandrosalesp@gmail.com}
    google-client-id: ${GOOGLE_CLIENT_ID:186642839091-bfvrv5h1knk4rdpvig934i26g8s3u3hv.apps.googleusercontent.com}
    seed-demo-users: ${SEED_DEMO_USERS:false}
  keepalive:
    enabled: ${RENDER_KEEPALIVE_ENABLED:true}
    url: ${RENDER_EXTERNAL_URL:https://kontaback.onrender.com/api/v1/security/public-key}
