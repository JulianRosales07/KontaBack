spring:
  application:
    name: accounting-service-dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/accounting_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000

app:
  organization:
    name: ${ORGANIZATION_NAME:Asociación}
    nit: ${ORGANIZATION_NIT:}
  security:
    # Solo asignación inicial: se otorga SUPER_ADMIN a este correo únicamente si aún no existe ningún SUPER_ADMIN.
    bootstrap-super-admin-email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:juliandrosalesp@gmail.com}
    google-client-id: ${GOOGLE_CLIENT_ID:186642839091-bfvrv5h1knk4rdpvig934i26g8s3u3hv.apps.googleusercontent.com}
    seed-demo-users: ${SEED_DEMO_USERS:true}
